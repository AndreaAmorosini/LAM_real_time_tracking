[project]
name = "lam"
version = "0.1.0"
description = "Pixi environment for aigc3d/LAM"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
bash= "*"
python = "3.10.*"
pip = "*"
setuptools = "*"
wheel = "*"
git = "*"
cmake = "*"
ninja = "*"
make = "*"
ffmpeg = "*"
zip = "*"
unzip = "*"
nodejs="*"
wget = "*"
tar = "*"
xz = "*"

# Toolchain utile per compilare pytorch3d, nvdiffrast, simple-knn e diff-gaussian-rasterization
gcc_linux-64 = "11.*"
gxx_linux-64 = "11.*"
binutils_linux-64 = "*"

# Toolkit CUDA locale dentro Pixi. Se preferisci usare /usr/local/cuda, puoi rimuovere queste due righe.
cuda-version = "12.1.*"
cuda-nvcc = "12.1.*"
cuda-cudart-dev = "*"
cuda-libraries-dev = "*"
cuda-cccl = "*"

[tasks]

# ---------------------------------------------------------------------
# One-command setup
# ---------------------------------------------------------------------

setup-all = "bash scripts/live-install/pixi-setup-all.sh"
fix-scripts-permissions = "bash scripts/live-install/fix-script-permission.sh"

# ---------------------------------------------------------------------
# Setup substeps
# ---------------------------------------------------------------------

setup-python-base = "bash scripts/live-install/setup/setup-python-base.sh"
setup-torch-cu121 = "bash scripts/live-install/setup/setup-torch-cu121.sh"
setup-live = "bash scripts/live-install/setup/setup-live.sh"
setup-cuda-ext = "bash scripts/pixi-install-cuda-ext.sh"

# Downloads
setup-weights = "bash scripts/live-install/setup/setup-weights.sh"
setup-faceboxes = "bash scripts/live-install/setup/setup-faceboxes.sh"
setup-mediapipe-model = "bash scripts/live-install/setup/setup-mediapipe-model.sh"

# Blender / FBX
setup-blender = "bash scripts/live-install/setup/setup-blender.sh"
setup-fbx-sdk = "bash scripts/live-install/setup/setup-fbx-sdk.sh"

# Frontend
setup-webgl = "npm --prefix webgl_frontend install"
webgl-build = "npm --prefix webgl_frontend run build"
webgl-dev = "npm --prefix webgl_frontend run dev --host 127.0.0.1 --port 5173"

# ---------------------------------------------------------------------
# Diagnostics
# ---------------------------------------------------------------------

doctor = "bash scripts/live-install/pixi-doctor.sh"

check-gpu = """
python -c "import torch; print('torch:', torch.__version__); print('cuda available:', torch.cuda.is_available()); print('torch cuda:', torch.version.cuda); print('gpu:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'none')"
"""

check-blender = "thirdparties/blender/blender-4.0.2-linux-x64/blender --version"

# ---------------------------------------------------------------------
# Apps
# ---------------------------------------------------------------------

app-live-web = """
bash -lc '
export LAM_BLENDER_PATH="${LAM_BLENDER_PATH:-$PWD/thirdparties/blender/blender-4.0.2-linux-x64/blender}"
export CUDA_HOME="$CONDA_PREFIX"
export CPATH="$CONDA_PREFIX/targets/x86_64-linux/include:${CPATH:-}"
export CPLUS_INCLUDE_PATH="$CONDA_PREFIX/targets/x86_64-linux/include:${CPLUS_INCLUDE_PATH:-}"
export C_INCLUDE_PATH="$CONDA_PREFIX/targets/x86_64-linux/include:${C_INCLUDE_PATH:-}"
export LIBRARY_PATH="$CONDA_PREFIX/targets/x86_64-linux/lib:${LIBRARY_PATH:-}"
export LD_LIBRARY_PATH="$CONDA_PREFIX/targets/x86_64-linux/lib:${LD_LIBRARY_PATH:-}"
export TORCH_CUDA_ARCH_LIST="${TORCH_CUDA_ARCH_LIST:-8.9}"
PYTHONPATH=. python app_live_web.py
'
"""

# ---------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------

test-webcam = "PYTHONPATH=. python -m lam.live.camera"
test-mediapipe = "PYTHONPATH=. python -m lam.live.trackers.mediapipe_face_tracker"
test-live-motion = "PYTHONPATH=. python -m lam.live.live_motion"
test-flame-adapter = "PYTHONPATH=. python -m lam.live.retargeting.mediapipe_to_flame"