<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LAM WebGL Live</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #avatar {
      flex: 1;
      background: #000;
      min-width: 0;
    }

    #side {
      width: 420px;
      box-sizing: border-box;
      padding: 12px;
      background: #1a1a1a;
      border-left: 1px solid #333;
      overflow: auto;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
      padding: 8px;
      background: #222;
      color: #eee;
      border: 1px solid #444;
    }

    button {
      cursor: pointer;
      background: #333;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    label {
      display: block;
      margin-bottom: 4px;
      color: #bbb;
      font-size: 13px;
    }

    pre {
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.35;
      background: #111;
      padding: 10px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <div id="avatar"></div>

  <aside id="side">
    <h3>LAM WebGL Live</h3>

    <label>Photo</label>
    <input id="photoInput" type="file" accept="image/*" />

    <label>Blender path optional</label>
    <input
      id="blenderPathInput"
      type="text"
      placeholder="/path/to/blender or leave empty"
    />

    <button id="createBtn">Upload Photo → Create Avatar → Start Live</button>

    <pre id="status">Select a photo and create avatar.</pre>
  </aside>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
